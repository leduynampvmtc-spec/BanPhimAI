name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          if ! gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            grep -E "error:|What went wrong|e: " -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk BanPhimAI.apk

      - uses: actions/upload-artifact@v5
        with:
          name: BanPhimAI-apk
          path: BanPhimAI.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bàn phím AI 1.0.${{ github.run_number }}
          body: |
            Tải file **BanPhimAI.apk** bên dưới về điện thoại Android rồi mở để cài.
            Lần đầu: cho phép cài từ nguồn không xác định; nếu Play Protect cảnh báo, chọn "Vẫn cài đặt".
          files: BanPhimAI.apk
          make_latest: true
